name: Sync GitHub Repositories

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Sync Public Repositories
        working-directory: ./frontend
        run: npm run sync:github

      - name: Commit & Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add frontend/src/projects.autogen.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(sync): auto-update public repositories from GitHub" && git push)
